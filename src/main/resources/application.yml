spring:
  application:
    name: demo

  security:
    oauth2:
      client:
        registration:
          dex:
            client-id: boats-app
            client-secret: boats-app-secret
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope: openid,profile,email
        provider:
          dex:
            issuer-uri: http://127.0.0.1:5556/dex
      resourceserver:
        jwt:
          jwk-set-uri: http://127.0.0.1:5556/dex/keys

  management:
    security:
      enabled: false
    endpoint:
      health:
        show-details: always
    endpoints:
      web:
        exposure:
          include: health,info

  datasource:
    url: jdbc:h2:mem:boatdb
    driverClassName: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true

  sql:
    init:
      mode: always
      data-locations: classpath:data.sql
      schema-locations: classpath:schema.sql

server:
  port: 8080
  servlet:
    context-path: /

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operations-sorter: method
    tags-sorter: alpha

logging:
  level:
    root: INFO
    owt.demo: DEBUG
    org.springframework.web: DEBUG
    org.springframework.security: DEBUG
  pattern:
    console: "%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
