spring:
  security:
    oauth2:
      client:
        registration:
          dex:
            client-id: boats-app
            client-secret: boats-app-secret
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope: openid,profile,email
        provider:
          dex:
            authorization-uri: https://example.com/oauth2/authorize
            token-uri: https://example.com/oauth2/token
            user-info-uri: https://example.com/userinfo
            jwk-set-uri: https://example.com/.well-known/jwks.json
            user-name-attribute: sub
      resourceserver:
        jwt:
          jwk-set-uri: https://example.com/.well-known/jwks.json
